name: Build and Push to Docker Hub

on:
  push:
    branches:
      - dev
    paths:
      - 'pos-backend/**'
      - 'pos-frontend/**'
      - '.github/workflows/**'

env:
  DOCKER_HUB_USERNAME: rprakashdass
  REGISTRY: docker.io

jobs:
  # Detects which services changed so downstream jobs can skip unnecessary builds
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed services
        id: changes
        run: |
          # Fall back to listing all files on first commit (no HEAD~1)
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git ls-files)
          echo "Changed files: $CHANGED"

          # Workflow changes trigger both builds to validate the pipeline itself
          if echo "$CHANGED" | grep -q "^pos-backend/\|^\.github/workflows/"; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

          if echo "$CHANGED" | grep -q "^pos-frontend/\|^\.github/workflows/"; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

  build-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push pos-backend
        uses: docker/build-push-action@v5
        with:
          context: ./pos-backend
          file: ./pos-backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-backend:latest
            ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-backend:${{ steps.vars.outputs.sha }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "sha=${GITHUB_SHA:0:7}" >> $GITHUB_OUTPUT

      - name: Build and push pos-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./pos-frontend
          file: ./pos-frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-frontend:latest
            ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-frontend:${{ steps.vars.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
