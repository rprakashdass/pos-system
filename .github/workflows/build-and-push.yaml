name: Build and Push to Docker Hub

# TRIGGER: When does this workflow run?
on:
  push:
    branches:
      # - main  # Only run on pushes to main branch
      - dev

# ENVIRONMENT VARIABLES
env:
  DOCKER_HUB_USERNAME: rprakashdass
  REGISTRY: docker.io

# JOBS: What to do when workflow runs
jobs:
  build-and-push:
    runs-on: ubuntu-latest  # Run on GitHub's Linux servers

    steps:
      # Step 1: Get the code from GitHub
      - name: Checkout code
        uses: actions/checkout@v4
        # This clones your repository so we have the code to build

      # Step 2: Set up Docker
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        # Buildx = advanced Docker build tool (faster, better caching)

      # Step 3: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}  # ← This comes from GitHub Secrets
        # This authenticates us to Docker Hub so we can push images

      # Step 4: Generate image tags
      - name: Generate image tags
        id: meta
        run: |
          COMMIT_SHA=${{ github.sha }}
          SHORT_SHA=${COMMIT_SHA:0:7}  # First 7 chars of commit hash
          echo "backend_tags=${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-backend:latest,${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-backend:$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "ui_tags=${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-frontend:latest,${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-frontend:$SHORT_SHA" >> $GITHUB_OUTPUT

      # Step 5: Build and push pos-backend
      - name: Build and push pos-backend
        uses: docker/build-push-action@v5
        with:
          context: ./pos-backend
          file: ./pos-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 6: Build and push pos-frontend
      - name: Build and push pos-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./pos-frontend
          file: ./pos-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.ui_tags }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 7: Print summary
      - name: Print build summary
        run: |
          echo "✅ Build completed successfully!"
          echo "Backend image: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-backend:latest"
          echo "UI image: ${{ env.REGISTRY }}/${{ env.DOCKER_HUB_USERNAME }}/pos-frontend:latest"
          echo "Commit: ${{ github.sha }}"